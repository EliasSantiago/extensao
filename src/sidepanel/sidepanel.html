<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexo</title>
    <link rel="stylesheet" href="../assets/theme.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <button id="btn-title" class="title-btn" title="Histórico de conversas">
        <span id="chat-title">Nova conversa</span>
      </button>
      <div class="actions">
        <button id="btn-new" class="icon-btn" title="Nova conversa" aria-label="Nova conversa"><i data-icon="pencil-square"></i></button>
        <button id="btn-history" class="icon-btn" title="Histórico" aria-label="Histórico"><i data-icon="clock"></i></button>
        <button id="btn-settings" class="icon-btn" title="Configurações" aria-label="Configurações"><i data-icon="cog-6-tooth"></i></button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite">
      <section id="welcome" class="welcome">
        <div class="mark"><i data-icon="nexo"></i></div>
        <h1>Olá! Em que posso ajudar?</h1>
        <p class="lead">Converse com o modelo que preferir. Para falar sobre a aba aberta, use um atalho abaixo ou mencione “esta página” na pergunta.</p>
        <div class="suggestions">
          <button class="suggestion" data-page="1" data-prompt="Resuma esta página em tópicos, destacando os pontos principais.">
            <span class="s-icon"><i data-icon="document-text"></i></span>
            <span class="s-text"><strong>Resumir a página</strong><small>Tópicos com os pontos principais</small></span>
          </button>
          <button class="suggestion" data-page="1" data-prompt="Quais são as principais conclusões e dados importantes desta página?">
            <span class="s-icon"><i data-icon="light-bulb"></i></span>
            <span class="s-text"><strong>Extrair pontos-chave</strong><small>Conclusões e dados importantes</small></span>
          </button>
          <button class="suggestion" data-page="1" data-prompt="Traduza o conteúdo principal desta página para português do Brasil.">
            <span class="s-icon"><i data-icon="language"></i></span>
            <span class="s-text"><strong>Traduzir a página</strong><small>Para português do Brasil</small></span>
          </button>
          <button class="suggestion" data-prompt="Me ajude a escrever um e-mail profissional sobre: ">
            <span class="s-icon"><i data-icon="envelope"></i></span>
            <span class="s-text"><strong>Escrever um e-mail</strong><small>Profissional e objetivo</small></span>
          </button>
        </div>
      </section>
    </main>

    <footer class="composer">
      <div id="context-chip" class="context-chip hidden">
        <i data-icon="paper-clip"></i>
        <span id="context-chip-text"></span>
        <button id="context-chip-clear" class="chip-x" title="Remover" aria-label="Remover contexto"><i data-icon="x-mark"></i></button>
      </div>

      <div class="input-box">
        <textarea id="input" rows="1" placeholder="Pergunte qualquer coisa…" aria-label="Mensagem"></textarea>
        <div class="input-bar">
          <div class="model-picker">
            <button id="model-btn" class="model-btn" type="button" aria-haspopup="listbox" aria-expanded="false" title="Escolher modelo">
              <span id="model-btn-icon" class="model-btn-icon"></span>
              <span id="model-btn-label" class="model-btn-label">Escolher modelo</span>
              <i data-icon="chevron-up-down" class="chev"></i>
            </button>
            <div id="model-menu" class="model-menu hidden" role="dialog" aria-label="Modelos">
              <div class="menu-search">
                <i data-icon="magnifying-glass"></i>
                <input id="model-search" type="text" placeholder="Buscar modelo…" autocomplete="off" spellcheck="false" />
              </div>
              <div id="model-list" class="menu-list" role="listbox"></div>
              <button id="model-manage" class="menu-footer" type="button">
                <i data-icon="cog-6-tooth"></i>
                Gerenciar provedores e modelos
              </button>
            </div>
          </div>
          <button id="btn-send" class="send-btn" title="Enviar" aria-label="Enviar" disabled>
            <i data-icon="arrow-up" class="i-send"></i>
            <i data-icon="solid:stop" class="i-stop"></i>
          </button>
        </div>
      </div>
      <p class="disclaimer">Respostas geradas por IA podem conter erros.</p>
    </footer>

    <aside id="history" class="drawer hidden" aria-label="Histórico">
      <div class="drawer-head">
        <strong>Histórico</strong>
        <button id="history-close" class="icon-btn" aria-label="Fechar"><i data-icon="x-mark"></i></button>
      </div>
      <label class="search">
        <i data-icon="magnifying-glass"></i>
        <input id="history-search" type="search" placeholder="Buscar conversas…" />
      </label>
      <ul id="history-list"></ul>
    </aside>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
