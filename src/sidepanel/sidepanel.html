<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat IA</title>
    <link rel="stylesheet" href="../assets/theme.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v6a2.5 2.5 0 0 1-2.5 2.5H11l-4 4v-4h0a2 2 0 0 1-2-2z" /></svg>
        </span>
        <div class="brand-text">
          <strong>Chat IA</strong>
          <span id="chat-title">Nova conversa</span>
        </div>
      </div>
      <div class="actions">
        <button id="btn-new" class="icon-btn" title="Nova conversa" aria-label="Nova conversa">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button id="btn-history" class="icon-btn" title="Histórico" aria-label="Histórico">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l3 3" /></svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="Configurações" aria-label="Configurações">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite">
      <section id="welcome" class="welcome">
        <p class="eyebrow">Chat IA</p>
        <h1>Olá.<br /><span>Em que posso ajudar?</span></h1>
        <p class="lead">Escolha o modelo e converse. Ative <b>Usar página</b> para incluir o conteúdo da aba atual.</p>
        <div class="suggestions">
          <button class="suggestion" data-page="1" data-prompt="Resuma esta página em tópicos, destacando os pontos principais.">
            <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5M9 13h6M9 17h4" /></svg>
            <strong>Resumir</strong><span>esta página</span>
          </button>
          <button class="suggestion" data-page="1" data-prompt="Quais são as principais conclusões e dados importantes desta página?">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
            <strong>Pontos-chave</strong><span>da página</span>
          </button>
          <button class="suggestion" data-page="1" data-prompt="Traduza o conteúdo principal desta página para português do Brasil.">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></svg>
            <strong>Traduzir</strong><span>para português</span>
          </button>
          <button class="suggestion" data-prompt="Me ajude a escrever um e-mail profissional sobre: ">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 6 9-6" /></svg>
            <strong>Escrever</strong><span>um e-mail</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="composer">
      <div id="context-chip" class="context-chip hidden">
        <svg viewBox="0 0 24 24"><path d="M21 12.5l-8.4 8.4a5 5 0 0 1-7.1-7.1l8.4-8.4a3.3 3.3 0 0 1 4.7 4.7l-8.4 8.4a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8" /></svg>
        <span id="context-chip-text"></span>
        <button id="context-chip-clear" class="chip-x" title="Remover" aria-label="Remover contexto">×</button>
      </div>
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="Pergunte qualquer coisa…"></textarea>
        <div class="input-bar">
          <div class="left">
            <label class="toggle" title="Enviar título, URL e texto da aba atual junto com a mensagem">
              <input type="checkbox" id="use-page" />
              <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" /></svg>
              <span>Usar página</span>
            </label>
            <div class="model-pill">
              <select id="model-select" title="Modelo"></select>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
            </div>
          </div>
          <button id="btn-send" class="send-btn" title="Enviar" aria-label="Enviar">
            <svg class="i-send" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" /></svg>
          </button>
        </div>
      </div>
      <p class="disclaimer">Respostas geradas por IA podem conter erros.</p>
    </footer>

    <aside id="history" class="drawer hidden" aria-label="Histórico">
      <div class="drawer-head">
        <strong>Histórico</strong>
        <button id="history-close" class="icon-btn" aria-label="Fechar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <input id="history-search" type="search" placeholder="Buscar conversas…" />
      <ul id="history-list"></ul>
    </aside>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
